name: CI and registry release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AI_ENABLED: 'false'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Prepare isolated and hash-pinned build tools
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements.build.lock
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --index-url https://pypi.org/simple --no-build-isolation --check-build-dependencies -c requirements.lock '.[test]'
      - name: Inventory runner dependencies and require exact constraint coverage
        run: python tools/build_materials.py --require-pins --npm-lock frontend/package-lock.json > runner-materials-linux.json
      - name: Linux sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libseccomp2
      - name: Native Linux Landlock and seccomp proofs (no skipped fallback)
        run: python -m pytest tests/test_extraction_linux.py tests/test_extraction_protocol.py -q
      - name: Build and prove the isolated production runtime without network or volumes
        run: |
          docker build --target isolation-tests --tag documind-ci-isolation .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1536m --cpus 2 --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777 documind-ci-isolation
      - name: Portable and POSIX Python and migration tests with SQLite
        run: python -m pytest -q
      - name: Build the existing PostgreSQL 17 pgvector image
        run: docker build --file Dockerfile.db --tag documind-ci-postgres .
      - name: Start an isolated PostgreSQL test database
        run: |
          docker run --detach --name documind-ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=lot210 --env POSTGRES_PASSWORD=ci-test-only \
            --env POSTGRES_DB=documind_test documind-ci-postgres
          for attempt in $(seq 1 60); do
            # initdb's temporary server listens only on a Unix socket; require final TCP readiness.
            if docker exec documind-ci-postgres pg_isready -h 127.0.0.1 -U lot210 -d documind_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Required PostgreSQL qualification (zero skips)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lot210:ci-test-only@127.0.0.1:5432/documind_test
          DOCUMIND_TEST_POSTGRES_DSN: postgresql://lot210:ci-test-only@127.0.0.1:5432/postgres
        run: |
          python -m pytest -q --require-no-skips tests/test_lifecycle_lot210_protocol.py \
            tests/test_lifecycle_durability.py::test_concurrent_last_admission_with_independent_witness \
            tests/test_lifecycle_posix.py::test_inventory_postgresql_transaction_rejects_writes \
            tests/test_document_integrity.py::test_postgresql_verifier_waits_for_original_writer_fence \
            tests/test_release_security.py::test_real_postgresql_history_and_disabled_account_guard
      - name: Required native root ownership proofs (zero skips)
        run: |
          sudo .ci-venv/bin/python -m pytest -q -p no:cacheprovider --require-no-skips \
            tests/test_release_security.py::test_real_root_registry_permissions_and_symlinks \
            tests/test_release_security.py::test_real_approval_and_installed_backup_guard_end_to_end
      - name: Required native non-root ownership proof (zero skips)
        run: |
          python -m pytest -q --require-no-skips tests/test_release_security.py::test_non_root_registry_is_not_an_authority
      - name: Full PostgreSQL and pgvector integration suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lot210:ci-test-only@127.0.0.1:5432/documind_test
          DOCUMIND_TEST_POSTGRES_DSN: postgresql://lot210:ci-test-only@127.0.0.1:5432/postgres
        run: python -m pytest -q
      - name: Preserve runner materials separately from the security release bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documind-runner-materials-linux-${{ github.sha }}
          path: runner-materials-linux.json
          if-no-files-found: ignore
          retention-days: 90

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      AI_ENABLED: 'false'
      OPENAI_API_KEY: ''
      REGISTRATION_MODE: 'disabled'
      DATABASE_URL: 'sqlite://'
      BFF_SERVICE_KEY: ''
      API_KEYS: '{}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare isolated and hash-pinned build tools
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.ci-venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements.build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.ci-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install portable test dependencies and IANA time zones
        run: python -m pip install --index-url https://pypi.org/simple --no-build-isolation --check-build-dependencies -c requirements.lock '.[test]' tzdata
      - name: Verify Windows Python and Paris time zone
        run: python -c "import sys; from zoneinfo import ZoneInfo; assert sys.platform == 'win32' and sys.version_info[:2] == (3, 13); ZoneInfo('Europe/Paris')"
      - name: Inventory runner dependencies and require exact constraint coverage
        run: |
          $report = python tools/build_materials.py --require-pins --npm-lock frontend/package-lock.json
          $status = $LASTEXITCODE
          $report | Set-Content -Encoding utf8 runner-materials-windows.json
          if ($status -ne 0) { exit $status }
      # Provider behavior is exercised only by mocked fixtures; no real AI client is allowed.
      # Only explicitly marked native cases move to Linux, whose full suites include them.
      - name: Portable Windows suite with disposable SQLite databases
        run: |
          Remove-Item Env:TEST_DATABASE_URL -ErrorAction SilentlyContinue
          python -m pytest -q -p no:cacheprovider -m "not posix"
      - name: Preserve runner materials separately from the security release bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documind-runner-materials-windows-${{ github.sha }}
          path: runner-materials-windows.json
          if-no-files-found: ignore
          retention-days: 90

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: React tests
        run: npm run test:ui
      - name: BFF security and proxy tests
        run: npm run test:bff
      - name: TypeScript and production frontend build
        run: npm run build

  publish:
    needs: [python, windows, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Record the actual Docker builder before registry authentication
        run: |
          docker version
          docker buildx version
          docker buildx inspect
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.adelinemeistertzheim.fr
          username: ${{ secrets.REGISTRY_PUSH_USERNAME }}
          password: ${{ secrets.REGISTRY_PUSH_PASSWORD }}
      - name: Refuse overwriting a published SHA tag
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python tools/check_registry_tags.py
      - name: Backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.documind.security-profile=public-beta-2026-10-v1
      - name: Frontend and BFF image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.documind.security-profile=public-beta-2026-10-v1
      - name: Existing PostgreSQL pgvector image
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.db
          platforms: linux/amd64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/postgres:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.documind.security-profile=public-beta-2026-10-v1
      - name: Create digest-pinned release bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        run: |
          mkdir release-bundle
          python tools/release_manifest.py --sha "$RELEASE_SHA" \
            --backend "$BACKEND_DIGEST" --frontend "$FRONTEND_DIGEST" \
            --postgres "$POSTGRES_DIGEST" --security-profile public-beta-2026-10-v1 --output release-bundle/release.json
          cp compose.production.yaml tools/deploy_production.py tools/backup_local.py tools/release_manifest.py tools/public_beta_policy.py release-bundle/
          cp tools/release_security.py tools/backup_production.py tools/verify_snapshot.py tools/validate_restore.py \
            tools/retention_production.py tools/monitor_production.py tools/gmail_monitor_alert.py release-bundle/
          cp ops/systemd/documind-backup.service ops/systemd/documind-backup.timer \
            ops/systemd/documind-backup-alert.service ops/systemd/documind-monitor.service \
            ops/systemd/documind-monitor.timer ops/systemd/documind-retention.service \
            ops/systemd/documind-retention.timer release-bundle/
          python tools/release_security.py create release-bundle
          cat release-bundle/release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documind-release-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90
