name: CI and registry release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AI_ENABLED: 'false'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Python and migration tests with SQLite
        run: python -m pytest -q
      - name: Build the existing PostgreSQL 17 pgvector image
        run: docker build --file Dockerfile.db --tag documind-ci-postgres .
      - name: Start an isolated PostgreSQL test database
        run: |
          docker run --detach --name documind-ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=documind --env POSTGRES_PASSWORD=ci-test-only \
            --env POSTGRES_DB=documind_test documind-ci-postgres
          for attempt in $(seq 1 60); do
            if docker exec documind-ci-postgres pg_isready -U documind -d documind_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Full PostgreSQL and pgvector integration suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://documind:ci-test-only@127.0.0.1:5432/documind_test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: React tests
        run: npm run test:ui
      - name: BFF security and proxy tests
        run: npm run test:bff
      - name: TypeScript and production frontend build
        run: npm run build

  publish:
    needs: [python, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.adelinemeistertzheim.fr
          username: ${{ secrets.REGISTRY_PUSH_USERNAME }}
          password: ${{ secrets.REGISTRY_PUSH_PASSWORD }}
      - name: Refuse overwriting a published SHA tag
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python tools/check_registry_tags.py
      - name: Backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Frontend and BFF image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Existing PostgreSQL pgvector image
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.adelinemeistertzheim.fr/documind-ai/postgres:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Create digest-pinned release bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        run: |
          mkdir release-bundle
          python tools/release_manifest.py --sha "$RELEASE_SHA" \
            --backend "$BACKEND_DIGEST" --frontend "$FRONTEND_DIGEST" \
            --postgres "$POSTGRES_DIGEST" --output release-bundle/release.json
          cp compose.production.yaml tools/deploy_production.py tools/backup_local.py tools/release_manifest.py release-bundle/
          cat release-bundle/release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documind-release-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90
