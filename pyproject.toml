[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1", "PyMuPDF>=1.25,<2", "psutil>=6,<8",
  "openai>=2,<3", "pgvector>=0.4,<1", "argon2-cffi>=25.1,<26"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
desktop = ["customtkinter>=5.2,<6", "Pillow>=11,<13", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["backend*", "analyseur_documents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
