services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: documind-postgres-vector:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind}@db:5432/${POSTGRES_DB:-documind}
      STORAGE_DIR: /app/var/documents
      EXTRACTION_MODE: sandbox
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - documents:/app/var
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2
    pids_limit: 64
    init: true
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 32 --timeout-keep-alive 5"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
  web:
    build: ./frontend
    environment:
      API_KEYS: ${API_KEYS:-}
      BFF_API_KEY: ${BFF_API_KEY:-}
      BFF_SERVICE_KEY: ${BFF_SERVICE_KEY:-}
      BFF_BACKEND_URL: http://api:8000
      BFF_HOST: 0.0.0.0
      BFF_PORT: 3000
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-30}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_SUMMARY_STEPS: ${AI_MAX_SUMMARY_STEPS:-5}
      DOCUMIND_GATEWAY_TOKEN: ${DOCUMIND_GATEWAY_TOKEN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    init: true
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOCUMIND_GATEWAY_TOKEN: ${DOCUMIND_GATEWAY_TOKEN:-}
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
volumes:
  postgres_data:
  documents:
  caddy_data:
  caddy_config:
