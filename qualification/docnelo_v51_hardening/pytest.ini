[pytest]
addopts = --noconftest -p no:cacheprovider -p qualification.docnelo_v51_hardening.pytest_plugin --ignore=tests/test_public_beta_snapshot.py
pythonpath = ../..
testpaths =
    ../../tests/test_lifecycle_backup_lock.py
    ../../tests/test_restore_pgvector.py
    ../../tests/test_restore_hardening.py
    ../../tests/test_restore_hardening_postgres.py
    ../../tests/test_lifecycle_keys_restore.py
markers =
    posix: requires actual POSIX permissions and flock; not a Windows qualification
